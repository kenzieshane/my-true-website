<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        (function () {
            var path = location.pathname;
            if (/\/about\.html$/i.test(path)) {
                var target = path.replace(/about\.html$/i, 'about.html') + location.search + location.hash;
                location.replace(target);
            }
        })();
    </script>
</head>
<body>
    <p>Page not found. <a href="index.html">Go to the homepage</a>.</p>
</body>
</html>
